[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "taskseam"
version = "0.1.0"
description = "Local task checkpoints and context deltas across AI tools"
requires-python = ">=3.9"

[project.scripts]
taskseam = "taskseam.__main__:main"

[tool.setuptools.packages.find]
include = ["taskseam*"]
